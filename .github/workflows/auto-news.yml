name: Auto-News Pipeline

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/content/**/*.mdx'

permissions:
  contents: write

jobs:
  auto-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto-News Pipeline
        run: node scripts/auto-news/pipeline.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          NODE_NO_WARNINGS: 1

      - name: Enhance Blog Articles (SEO/AEO/GEO/LLMs)
        run: node scripts/auto-news/enhance-blog.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_NO_WARNINGS: 1

      - name: Rebuild Search Index
        run: node scripts/build-search-index.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-news: fresh articles + SEO/AEO/GEO enhancement'
          file_pattern: 'src/content/ public/search-index.json'
          commit_user_name: 'TechVeb Auto-News Bot'
          commit_user_email: 'auto@techveb.com'
          push_options: '--force-with-lease'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

name: Refresh News
on:
  # Disabled: redundant with auto-news.yml (same schedule, raw image URLs incompatible with Cloudinary)
  workflow_dispatch:  # Manual trigger only

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape news
        run: node scripts/scrape-news.mjs

      - name: Check for changes
        id: changes
        run: |
          git add src/content/news/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "TechVeb Bot"
          git config user.email "bot@techveb.com"
          git commit -m "chore: auto-refresh news articles"
          git push
